function rowLine(row, cols){ return cols.map(function(c){ return c + '=' + (row[c] === null || row[c] === undefined ? 'NULL' : row[c]); }).join(' · '); }
function sqlDivergence(res, chk){
  if (!res.ok) return {kind: 'error', text: 'Your query stopped on an error (shown above).', question: 'Read the error as a sentence: it names what the engine could not find or could not parse. Which name or keyword is off?'};
  var exp = chk.expected, act = res.rows;
  var ecols = exp.length ? Object.keys(exp[0]) : chk.cols || [];
  var gl = exp.map(function(r){ return rowLine(r, ecols); });
  if (JSON.stringify(res.cols) !== JSON.stringify(ecols)) return {kind: 'cols', goalLines: gl,
    text: 'Your columns are (' + res.cols.join(', ') + '); the goal asks for (' + ecols.join(', ') + ').',
    question: 'Re-read the goal\u2019s column list: which column is missing, extra, or named differently in your SELECT?'};
  var es = exp.map(function(r){ return JSON.stringify(r); }).sort(), as = act.map(function(r){ return JSON.stringify(r); }).sort();
  if (act.length < exp.length){
    var missing = exp.filter(function(r){ return as.indexOf(JSON.stringify(r)) < 0; })[0];
    return {kind: 'missing', goalLines: gl,
      text: 'Your result has ' + act.length + ' rows; the goal has ' + exp.length + '. One row the goal keeps and yours drops: ' + (missing ? rowLine(missing, ecols) : '') + '.',
      question: 'Which part of your query throws rows away — the WHERE, or the JOIN? Walk the pipeline stage by stage: where does that row die?'};
  }
  if (act.length > exp.length){
    var extra = act.filter(function(r){ return es.indexOf(JSON.stringify(r)) < 0; })[0];
    return {kind: 'extra', goalLines: gl,
      text: 'Your result has ' + act.length + ' rows; the goal has ' + exp.length + '. One row yours includes and the goal excludes: ' + (extra ? rowLine(extra, ecols) : '') + '.',
      question: 'Extra rows usually mean a missing filter — or a grain problem: is your result one-row-per-something-finer than the goal\u2019s?'};
  }
  for (var i = 0; i < es.length; i++){
    if (es[i] !== as[i]){
      var er = exp.filter(function(r){ return JSON.stringify(r) === es[i]; })[0];
      var ar = act.filter(function(r){ return JSON.stringify(r) === as[i]; })[0];
      return {kind: 'rowdiff', goalLines: gl,
        text: 'Same row count, different rows: you have ' + (ar ? rowLine(ar, ecols) : '?') + ' where the goal has ' + (er ? rowLine(er, ecols) : '?') + '.',
        question: 'Same shape, wrong members — what decides membership in your query: the WHERE conditions, the grouping, or the ranking?'};
    }
  }
  /* same multiset but wrong order (ordered checks) */
  return {kind: 'order', goalLines: gl,
    text: 'The right rows, in the wrong order.',
    question: 'Membership is right; presentation is wrong. What does your ORDER BY sort by — and does it need a tie-break to be deterministic?'};
}

function javaChoiceHtml(ch, q){
  var h = '<div class="card"><p>Read the code and commit to an answer <i>before</i> checking. Guessing first is what makes it stick.</p>';
  if (q.input) h += '<div class="area-label">\u2328\uFE0F Input the program receives (one line per entry)</div><div class="outbox">' + escHtml(q.input.join('\n')) + '</div>';
  h += codeBlock(q.code) + '<p><b>' + escHtml(q.question) + '</b></p>';
  var perm = permFor('java:' + q.id, q.choices.length);
  h += perm.map(function(origIdx, dispIdx){
    var cls = '';
    if (S.qChecked && origIdx === q.answer) cls = 'correct';
    else if (S.qChecked && dispIdx === S.qSel) cls = 'wrong';
    else if (dispIdx === S.qSel) cls = 'selected';
    return '<button class="choice ' + cls + '" onclick="H.jPick(' + dispIdx + ')">' + escHtml(q.choices[origIdx]) + '</button>';
  }).join('');
  if (!S.qChecked) h += '<button class="btn" ' + (S.qSel < 0 ? 'disabled' : '') + ' onclick="H.jCheckChoice()">Check answer</button>';
  else {
    h += feedbackHtml(S.qWas, q.why);
    if (S.qWas) h += '<div class="stepnote">\uD83D\uDCCC The fundamental: ' + escHtml(q.note) + '</div>' + javaNextBtn(ch, q);
    else h += '<button class="btn secondary" onclick="H.jRetry()">Try again</button>';
  }
  return h + '</div>';
}

function viewReview(){

  h += '<div class="progressbar"><div id="cdBar" style="width:100%"></div></div>';
  h += '<div class="card">' + codeBlock(card.code) + '<p><b>' + escHtml(card.q) + '</b></p>';
  h += (S.cardPerm || card.choices.map(function(_, i){ return i; })).map(function(origIdx, dispIdx){
    var cls = '';
    if (S.checked && origIdx === card.answer) cls = 'correct';
    else if (S.checked && dispIdx === S.selected) cls = 'wrong';
    else if (dispIdx === S.selected) cls = 'selected';
    return '<button class="choice ' + cls + '" ' + (S.checked ? 'disabled' : '') + ' onclick="H.rapidPick(' + dispIdx + ')">' + escHtml(card.choices[origIdx]) + '</button>';
  }).join('');
  if (S.checked){
    h += feedbackHtml(S.wasCorrect, (S.timedOut ? '⏰ Time. ' : '') + card.why);
    h += '<button class="btn" onclick="H.rapidNext()">' + (S.pos + 1 >= S.order.length ? 'See results →' : 'Next card →') + '</button>';
  }
  return h + '</div>';
}

/* ---------- handlers ---------- */
window.H = {
  home: goHome,
  review: function(){ stopTimer(); S = {screen: 'review'}; render(); window.scrollTo(0, 0); },
  open: function(coll, id){ openLesson(coll, id, null); },
  openFromReview: function(coll, id, kind){
    if (coll === 'rapid'){ H.rapidStart(id); return; }
    if (coll === 'java'){ var jf2 = javaQuestionById(id); if (jf2) H.openQuestion(jf2.ch.id, id); return; }
    openLesson(coll, id, kind === 'build' || kind === 'shape' || kind === 'verdict' ? 'build' : kind);
  },
  rapidStart: function(deckId){
    stopTimer();
    var D = rapidDeck(deckId);
    var idx = D.cards.map(function(_, i){ return i; });
    for (var i = idx.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    S = {screen: 'rapid', deckId: deckId, order: idx.slice(0, RAPID_RUN), pos: 0,
         score: 0, streak: 0, bestStreak: 0, earned: 0,
         selected: -1, checked: false, wasCorrect: false, timedOut: false, finished: false,
         deadline: Date.now() + RAPID_SECONDS * 1000, startedAt: Date.now()};
    S.cardPerm = shuffledIdx(D.cards[S.order[0]].choices.length);
    render(); window.scrollTo(0, 0);
  },
  rapidPick: function(i){
    if (S.checked || S.finished) return;
    var D = rapidDeck(S.deckId); var card = D.cards[S.order[S.pos]];
    S.selected = i; S.checked = true; S.wasCorrect = (S.cardPerm ? S.cardPerm[i] : i) === card.answer;
    if (S.wasCorrect){
      S.score++; S.streak++; if (S.streak > S.bestStreak) S.bestStreak = S.streak;
      S.earned += XP_PER; state.xp.rapid += XP_PER; save();
    } else {
      S.streak = 0; recordMistake('rapid', S.deckId, 'rapid');
    }
    render();
  },
  rapidTimeout: function(){
    if (S.checked || S.finished) return;
    S.checked = true; S.wasCorrect = false; S.timedOut = true; S.streak = 0;
    recordMistake('rapid', S.deckId, 'rapid');
    render();
  },
  rapidNext: function(){
    if (S.pos + 1 >= S.order.length){
      state.rapid.plays[S.deckId] = (state.rapid.plays[S.deckId] || 0) + 1;
      if (S.score > (state.rapid.best[S.deckId] || 0)) state.rapid.best[S.deckId] = S.score;
      save(); S.finished = true;
    } else {
      S.pos++; S.selected = -1; S.checked = false; S.wasCorrect = false; S.timedOut = false;
      S.deadline = Date.now() + RAPID_SECONDS * 1000;
      var D = rapidDeck(S.deckId); S.cardPerm = shuffledIdx(D.cards[S.order[S.pos]].choices.length);
    }
    render(); window.scrollTo(0, 0);
  },
  jFilter: function(tag){ JTOPIC = tag || null; render(); window.scrollTo(0, 0); },
  openChapter: function(id){
    stopTimer(); S = {screen: 'jchapter', chId: id}; render(); window.scrollTo(0, 0);
  },
  openQuestion: function(chId, qid){
    stopTimer();
    var f = javaQuestionById(qid); if (!f) return;
    S = {screen: 'jquestion', chId: f.ch.id, qid: qid, qCode: null, qResult: null, qFails: 0,
         qShowHint: false, qSolutionSeen: false, qStudy: false, qSel: -1, qChecked: false,
         qWas: false, qColdCleared: false, orders: {}};
    render(); window.scrollTo(0, 0);
  },
  jNext: function(){
    var f = javaQuestionById(S.qid); if (!f) return;
    if (f.idx + 1 < f.ch.questions.length) H.openQuestion(f.ch.id, f.ch.questions[f.idx + 1].id);
    else H.openChapter(f.ch.id);
  },
  jToggleHint: function(){
    var ta = document.getElementById('editor'); if (ta) S.qCode = ta.value;
    S.qShowHint = !S.qShowHint; render();
  },
  jStudy: function(){
    var ta = document.getElementById('editor'); if (ta) S.qCode = ta.value;
    S.qSolutionSeen = true; S.qStudy = true; render(); window.scrollTo(0, 0);
  },
  jRebuild: function(){
    var f = javaQuestionById(S.qid); if (!f) return;
    S.qStudy = false; S.qCode = f.q.starter; S.qResult = null;
    render(); window.scrollTo(0, 0);
  },
  jRun: function(){
    var ta = document.getElementById('editor'); if (!ta) return;
    S.qCode = ta.value;
    var f = javaQuestionById(S.qid); if (!f) return;
    var q = f.q;
    var r = runProgram('java', S.qCode, q.input);
    var checks = [], allPass = r.ok;
    q.checks.forEach(function(chk){
      var pass = r.ok && JSON.stringify(r.output) === JSON.stringify(chk.lines);
      checks.push({pass: pass, label: 'Output is exactly: ' + chk.lines.join(' \u00B7 ')});
      if (!pass) allPass = false;
    });
    if (!r.ok) checks = [{pass: false, label: 'Program runs without errors'}];
    S.qResult = {output: r.output, error: r.ok ? null : r.error, checks: checks, allPass: allPass,
      diverge: allPass ? null : divergenceFor(r, javaQNorm(q))};
    if (allPass){
      if (!S.qSolutionSeen && coldPending('java', q.id)){
        state.mistakes = state.mistakes.filter(function(m){ return !(m.cold && m.coll === 'java' && m.concept === q.id); });
        S.qColdCleared = true;
      }
      javaComplete(q, S.qSolutionSeen);
    } else {
      S.qFails++; javaTagFail(q); recordMistake('java', q.id, q.type);
    }
    render();
  },
  jPick: function(i){ if (!S.qChecked){ S.qSel = i; render(); } },
  jRetry: function(){ S.qChecked = false; S.qSel = -1; render(); },
  jCheckChoice: function(){
    var f = javaQuestionById(S.qid); if (!f) return;
    var q = f.q;
    var perm = permFor('java:' + q.id, q.choices.length);
    S.qChecked = true; S.qWas = S.qSel >= 0 && perm[S.qSel] === q.answer;
    if (S.qWas){
      if (coldPending('java', q.id)){
        state.mistakes = state.mistakes.filter(function(m){ return !(m.cold && m.coll === 'java' && m.concept === q.id); });
        S.qColdCleared = true;
      }
      javaComplete(q, false);
    } else { javaTagFail(q); recordMistake('java', q.id, q.type); }
    render();
  },
  toStage: function(stage){
    stashStage();
    if (stage === 'build' && S.buildCode === null){
      var L = lessonById(S.coll, S.conceptId); S.buildCode = L.build.starter;
    }
    S.stage = stage; S.selected = -1; S.checked = false; S.wasCorrect = false;
    var idx = STAGES.indexOf(stage); if (idx > (S.maxStageIdx || 0)) S.maxStageIdx = idx;
    render(); window.scrollTo(0, 0);
  },
  gotoStage: function(stage){
    var idx = STAGES.indexOf(stage);
    if (idx < 0 || idx > (S.maxStageIdx || 0) || stage === S.stage) return;
    stashStage();
    S.stage = stage;
    var st = (S.stash || {})[stage];
    S.selected = st ? st.selected : -1; S.checked = st ? st.checked : false; S.wasCorrect = st ? st.wasCorrect : false;
    S.stepIdx = st ? st.stepIdx : 0; S.placed = st ? st.placed : [];
    render(); window.scrollTo(0, 0);
  },
  toggleData: function(){
    var ta = document.getElementById('editor'); if (ta) S.buildCode = ta.value;
    S.showData = !S.showData; render();
  },
  pick: function(i){ if (!S.checked){ S.selected = i; render(); } },
  retryChoice: function(){ S.checked = false; S.selected = -1; render(); },
  checkChoice: function(kind){
    var L = lessonById(S.coll, S.conceptId);
    var q = kind === 'predict' ? L.predict : L.step.finalQ;
    var perm = permFor(S.coll + ':' + L.id + ':' + kind, q.choices.length);
    S.checked = true; S.wasCorrect = S.selected >= 0 && perm[S.selected] === q.answer;
    if (S.wasCorrect) completeExercise(S.coll, L.id, kind);
    else recordMistake(S.coll, L.id, kind);
    render();
  },
  gatePick: function(kind, i){
    var L = lessonById(S.coll, S.conceptId);
    var q = kind === 'shape' ? L.build.shapeQ : L.build.verdictQ;
    var perm = permFor(S.coll + ':' + L.id + ':gate:' + kind, q.choices.length);
    if (perm[i] === q.answer){
      if (kind === 'shape'){ S.shapeDone = true; S.shapeGood = true; S.shapeMsg = 'Correct — ' + q.why; }
      else { S.verdictDone = true; S.verdictGood = true; S.verdictMsg = 'Correct — ' + q.why; completeExercise(S.coll, L.id, 'build', S.solutionSeen); }
    } else {
      if (kind === 'shape'){ S.shapeGood = false; S.shapeMsg = 'Not yet. ' + q.why; }
      else { S.verdictGood = false; S.verdictMsg = 'That verdict outruns your printed numbers. ' + q.why; }
      recordMistake(S.coll, L.id, kind);
    }
    render();
  },
  stepMove: function(d){ S.stepIdx = Math.max(0, S.stepIdx + d); S.selected = -1; S.checked = false; render(); },
  parsonsAdd: function(si){ S.placed.push(si); S.parsonsMsg = ''; render(); },
  parsonsRemove: function(pos){ S.placed.splice(pos, 1); S.parsonsMsg = ''; render(); },
  parsonsCheck: function(){
    var L = lessonById(S.coll, S.conceptId); var p = L.parsons;
    var got = S.placed.map(function(si){ return S.scrambled[si]; });
    var good = got.length === p.lines.length && got.every(function(v, i){ return v === i; });
    if (good){
      S.parsonsGood = true; S.parsonsMsg = '✅ Exactly right — and it runs, producing: ' + p.expected.join(' · ');
      completeExercise(S.coll, L.id, 'parsons');
    } else {
      S.parsonsGood = false; S.parsonsFails++;
      var firstWrong = 0; while (firstWrong < got.length && got[firstWrong] === firstWrong) firstWrong++;
      S.parsonsMsg = '❌ Not yet — the first line in the wrong place is line ' + (firstWrong + 1) + ' of your program. Think about what has to exist before it can be used.';
      if (S.parsonsFails >= 2) S.parsonsMsg += ' Ask yourself: does every line only use values created by the lines ABOVE it? Find the first line that reaches for something not yet built.';
      recordMistake(S.coll, L.id, 'parsons');
    }
    render();
  },
  toggleHint: function(){
    var ta = document.getElementById('editor'); if (ta) S.buildCode = ta.value;
    S.showHint = !S.showHint; render();
  },
  studySolution: function(){
    var ta = document.getElementById('editor'); if (ta) S.buildCode = ta.value;
    S.solutionSeen = true; S.studyMode = true; render(); window.scrollTo(0, 0);
  },
  rebuildSelf: function(){
    var L = lessonById(S.coll, S.conceptId);
    S.studyMode = false; S.buildCode = L.build.starter; S.buildResult = null;
    render(); window.scrollTo(0, 0);
  },
  runBuild: function(){
    var ta = document.getElementById('editor'); if (!ta) return;
    S.buildCode = ta.value;
    var L = lessonById(S.coll, S.conceptId); var b = L.build;
    if (L.sql){
      var sr = SQL_ENGINE.runSQL(S.buildCode, SQL_DB);
      var schecks = [], sallPass = true;
      b.checks.forEach(function(chk){
        var pass = false;
        if (sr.ok){
          pass = chk.ordered ? JSON.stringify(sr.rows) === JSON.stringify(chk.expected)
            : JSON.stringify(sr.rows.map(function(r){ return JSON.stringify(r); }).sort()) === JSON.stringify(chk.expected.map(function(r){ return JSON.stringify(r); }).sort());
        }
        schecks.push({pass: pass, label: pass ? 'Result table matches the goal' : 'Result table does not match the goal yet'});
        if (!pass) sallPass = false;
      });
      S.buildResult = {output: sr.ok ? sr.rows.map(function(r){ return rowLine(r, sr.cols); }) : [], error: sr.ok ? null : sr.error,
        checks: schecks, allPass: sallPass, diverge: sallPass ? null : sqlDivergence(sr, b.checks[0]),
        tableCols: sr.ok ? sr.cols : null, tableRows: sr.ok ? sr.rows : []};
      if (sallPass){ onBuildPassed(); completeExercise(S.coll, L.id, 'build', S.solutionSeen); }
      else { S.buildFails++; recordMistake(S.coll, L.id, 'build'); }
      render(); return;
    }
    var r = runProgram('python', S.buildCode);
    var checks = [];
    if (!r.ok){
      checks.push({pass: false, label: 'Program runs without errors'});
      S.buildResult = {output: r.output, error: r.error, checks: checks, allPass: false, diverge: divergenceFor(r, b)};
      S.buildFails++; recordMistake(S.coll, L.id, 'build');
    } else {
      var allPass = true;
      b.checks.forEach(function(chk){
        if (chk.type === 'output'){
          var pass = JSON.stringify(r.output) === JSON.stringify(chk.expected);
          checks.push({pass: pass, label: 'Output is exactly: ' + chk.expected.join(' · ')});
          if (!pass) allPass = false;
        } else if (chk.type === 'var'){
          var pass = JSON.stringify(r.globals[chk.name]) === JSON.stringify(chk.expected);
          checks.push({pass: pass, label: chk.name + ' ends up as ' + fmtVal(chk.expected) + (pass ? '' : ' (yours: ' + fmtVal(r.globals[chk.name]) + ')')});
          if (!pass) allPass = false;
        }
      });
      S.buildResult = {output: r.output, error: null, checks: checks, allPass: allPass, diverge: allPass ? null : divergenceFor(r, b)};
      if (allPass){
        onBuildPassed();
        if (b.verdictQ){ S.needVerdict = true; }
        else completeExercise(S.coll, L.id, 'build', S.solutionSeen);
      } else { S.buildFails++; recordMistake(S.coll, L.id, 'build'); }
    }
    render();
  },
  exportProgress: function(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'codedojo-progress.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  },
  importProgress: function(input){
    var f = input.files && input.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var s = JSON.parse(reader.result);
        if (!s || (s.v !== 1 && s.v !== 2)) throw new Error('bad file');
        state = migrate(s); save(); goHome();
        alert('Progress imported ✅');
      } catch (e){ alert('That file does not look like a Code Dojo progress backup.'); }
    };
    reader.readAsText(f);
  },
  resetAll: function(){
    if (confirm('Reset ALL Code Dojo progress on this device? Export first if you might want it back.')){
      state = defaultState(); try { localStorage.removeItem(KEY); } catch (e){}
      save(); goHome();
    }
  }
};

render();
})();

</script>

  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(e) { console.log('SW failed', e); });
  });
}
</script>
