<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Dojo — DE Interview Prep</title>
<meta name="description" content="A local-only, offline app for Data Engineer interview prep: Python drills, a SQL arena with a visual query stepper, rapid-fire operator quizzes, and fundamentals warm-ups. All data stays on your device.">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#16202e; --muted:#64748b; --line:#e2e8f0;
  --green:#22b573; --green-dark:#189a5f; --red:#ef4444; --amber:#f59e0b;
  --code-bg:#101828; --code-ink:#e6edf3; --accent-py:#2563eb; --accent-java:#ea580c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink)}
#app{max-width:560px; margin:0 auto; padding:16px 14px 48px}
a{color:var(--accent-py)}
button{font-family:inherit; cursor:pointer}
.topbar{display:flex; align-items:center; justify-content:space-between; margin:4px 0 14px}
.logo{font-size:24px; font-weight:800; letter-spacing:-.5px}
.logo span{color:var(--green)}
.stats{display:flex; gap:8px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px}
.tracktoggle{display:flex; background:#e8edf5; border-radius:14px; padding:4px; margin-bottom:16px}
.tracktoggle button{flex:1; border:0; background:transparent; padding:11px; border-radius:10px; font-size:16px; font-weight:700; color:var(--muted)}
.tracktoggle button.active-py{background:var(--accent-py); color:#fff}
.tracktoggle button.active-java{background:var(--accent-java); color:#fff}
.unithead{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin:10px 2px}
.pathcard{display:flex; gap:14px; align-items:center; width:100%; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; font-size:16px; color:var(--ink)}
.cards{display:flex; flex-direction:column}
.cards .pathcard{margin-bottom:12px}
@media (min-width: 820px){
  #app{max-width:1040px; padding:26px 30px 64px}
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .cards .pathcard{margin-bottom:0; height:100%}
  .editor{min-height:320px}
  .card{padding:22px}
}
@media (min-width: 1240px){
  #app{max-width:1180px}
  .cards{grid-template-columns:1fr 1fr 1fr}
}
.pathcard:not(:disabled){border-bottom-width:4px}
.pathcard:disabled{opacity:.45}
.pathcard .icon{font-size:30px}
.pathcard .t{font-weight:800; font-size:17px}
.pathcard .s{color:var(--muted); font-size:13px; margin-top:2px}
.pathcard .dots{margin-left:auto; font-size:13px; white-space:nowrap}
.pathcard.done{border-color:var(--green)}
.card{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px}
.card h2{margin:0 0 8px; font-size:21px}
.card h3{margin:14px 0 6px; font-size:16px}
.card p{line-height:1.55; margin:0 0 10px; font-size:15.5px}
.card ul{margin:6px 0 10px; padding-left:20px; line-height:1.55; font-size:15.5px}
pre.code{background:var(--code-bg); color:var(--code-ink); border-radius:12px; padding:14px; overflow-x:auto; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; line-height:1.5; margin:10px 0; white-space:pre}
pre.code .hl{background:rgba(250,204,21,.28); display:block; margin:0 -14px; padding:0 14px}
.code-label{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--muted)}
.note{font-size:14px; color:var(--muted); line-height:1.5}
.comparebox{border:2px dashed #cbd5e1; border-radius:14px; padding:12px 14px; margin-top:12px; background:#fbfcfe}
.btn{display:block; width:100%; border:0; border-radius:14px; padding:15px; font-size:16.5px; font-weight:800; background:var(--green); color:#fff; border-bottom:4px solid var(--green-dark); margin-top:12px}
.btn:active{transform:translateY(2px); border-bottom-width:2px}
.btn.secondary{background:#fff; color:var(--ink); border:2px solid var(--line); border-bottom-width:4px}
.btn.small{width:auto; display:inline-block; padding:10px 16px; font-size:14.5px; margin-top:0}
.btn:disabled{background:#cbd5e1; border-bottom-color:#94a3b8}
.choice{display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-bottom-width:4px; border-radius:14px; padding:13px 15px; font-size:15.5px; margin-bottom:10px; white-space:pre-line; font-family:inherit; color:var(--ink)}
.choice.selected{border-color:var(--accent-py); background:#eff6ff}
.choice.correct{border-color:var(--green); background:#ecfdf5}
.choice.wrong{border-color:var(--red); background:#fef2f2}
.feedback{border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.5; margin-top:12px}
.feedback.good{background:#ecfdf5; border:1.5px solid var(--green)}
.feedback.bad{background:#fef2f2; border:1.5px solid var(--red)}
.progressbar{height:12px; background:#e8edf5; border-radius:999px; overflow:hidden; margin:10px 0 16px}
.progressbar > div{height:100%; background:var(--green); border-radius:999px; transition:width .3s}
.stagechips{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
.chip{font-size:12px; font-weight:800; padding:5px 10px; border-radius:999px; background:#e8edf5; color:var(--muted); text-transform:uppercase; letter-spacing:.5px}
.chip.now{background:var(--ink); color:#fff}
.chip.done{background:var(--green); color:#fff}
.vars{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0}
.varbox{background:#fff7ed; border:1.5px solid #fdba74; border-radius:10px; padding:7px 11px; font-family:ui-monospace,Menlo,monospace; font-size:14px; font-weight:700}
.varbox b{color:#9a3412}
.outbox{background:#0b1220; color:#a7f3d0; border-radius:12px; padding:12px 14px; font-family:ui-monospace,Menlo,monospace; font-size:14px; min-height:44px; white-space:pre-wrap; margin:10px 0}
.stepnote{font-size:15px; line-height:1.5; background:#fffbeb; border:1.5px solid #fcd34d; border-radius:12px; padding:11px 13px}
.btnrow{display:flex; gap:10px; margin-top:12px}
.btnrow .btn{margin-top:0}
.parline{display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-bottom-width:4px; border-radius:12px; padding:11px 13px; font-family:ui-monospace,Menlo,monospace; font-size:14px; margin-bottom:8px; white-space:pre; overflow-x:auto; color:var(--ink)}
.parline.placed{background:#eff6ff; border-color:var(--accent-py)}
.area-label{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:14px 0 8px}
textarea.editor{width:100%; min-height:190px; background:var(--code-bg); color:var(--code-ink); border:0; border-radius:12px; padding:14px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; line-height:1.55; resize:vertical}
.checkline{font-size:14.5px; padding:7px 0; border-bottom:1px solid var(--line)}
.checkline:last-child{border-bottom:0}
.foottools{display:flex; gap:8px; flex-wrap:wrap; margin-top:20px}
.foottools button{background:#fff; border:2px solid var(--line); border-radius:10px; padding:9px 13px; font-weight:700; font-size:13.5px; color:var(--ink)}
.warn{background:#fef2f2; border:1.5px solid var(--red); border-radius:12px; padding:11px 13px; font-size:14px; line-height:1.5; margin-bottom:14px}
.locate{background:#eef4ff; border:1.5px solid var(--accent-py); border-radius:12px; padding:11px 13px; font-size:14.5px; line-height:1.5; margin-top:12px}
.locate-t{font-weight:800; margin-bottom:6px}
.vs{display:flex; gap:10px; flex-wrap:wrap}
.vsbox{flex:1; min-width:150px}
.vsbox .outbox{margin:4px 0}
.goalbox{border:1.5px solid var(--green)}
.qline{background:#fff; border-radius:8px; padding:8px 10px; margin:6px 0 2px}
.stripwrap{background:#f8fafc; border:1.5px solid var(--line); border-radius:12px; padding:11px 13px; margin-top:12px}
.strip{margin:4px 0 0 18px; padding:0; font-size:14.5px; line-height:1.55}
.backbtn{background:none; border:0; font-size:15.5px; font-weight:800; color:var(--muted); padding:6px 0}
.bigemoji{font-size:52px; text-align:center; margin:8px 0}
.center{text-align:center}
.hidden{display:none}
.sqlwrap{overflow-x:auto; margin:10px 0}
.sqltable{border-collapse:collapse; width:100%; font-size:13.5px; font-family:ui-monospace,Menlo,monospace}
.sqltable th{background:#101828; color:#e6edf3; text-align:left; padding:7px 9px; white-space:nowrap}
.sqltable td{border-bottom:1px solid var(--line); padding:6px 9px; white-space:nowrap}
.sqltable tr:last-child td{border-bottom:0}
.nullv{color:var(--red); font-style:italic}
.schemaline{font-size:13.5px; color:var(--muted); padding:3px 0; font-family:ui-monospace,Menlo,monospace}
.editor.sql{min-height:170px}
button.chip{font-family:inherit; border:0}
.chip.nav{cursor:pointer}
.chip.nav:hover{filter:brightness(.95)}

/* Java arm (CSCI-241) */
.qrow{display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; font-size:15px; color:var(--ink)}
.qrow:disabled{opacity:.5}
.qrow .qn{font-weight:800; min-width:26px}
.qrow .qt{flex:1}
.qrow .qt .s{color:var(--muted); font-size:12px; margin-top:2px}
.tagchip{display:inline-block; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; margin-right:4px; color:var(--muted)}
.prompt{white-space:pre-wrap}

</style>

<script>
'use strict';
/* Code Dojo — Unit 1 content. One concept spine, paired Python/Java realizations.
   Exercise shapes:
   predict {code, question, choices[], answer, why}
   step    {code, steps[{line, vars{}, out, note}], finalQ{question, choices, answer, why}}
   parsons {prompt, lines[correct order], expected[output lines]}
   build   {prompt, starter, hint, solution, checks[{type:'output',expected[]} | {type:'var',name,expected}]} */
const CONCEPTS = [
{
  id: 'variables', num: 1, icon: '📦', title: 'Variables & Types',
  tagline: 'Named boxes that hold values',
  teach: {
    body: 'A variable is a named box. You put a value in it, and later you can look inside, use the value in a calculation, or replace it with a new value.\n\nThe most important mental shift: in code, `x = x + 1` is not an equation. It means "take what is in x now, add 1, and put the result back in x." The right side always happens first.\n\nEvery value also has a type — whole numbers, decimal numbers, text (strings), and true/false (booleans) behave differently. Adding two numbers does math; adding two strings glues them together.',
    points: ['Assignment `=` puts a value in a box — it is not math equality', 'The right side is computed first, then stored', 'Re-assigning replaces the old value completely', 'Main types: integer, decimal, string (text), boolean (true/false)'],
    compare: 'Python figures out the type from the value and lets you change it later. Java makes you declare the type up front (`int age = 30;`) and then enforces it — a box labeled int can never hold text. Same boxes, stricter labels.'
  },
  py: {
    label: 'Python',
    teachCode: 'name = "Andrew"\nage = 30\nheight = 5.9\nis_coding = True\n\nage = age + 1\nprint(name)\nprint(age)',
    teachNote: 'No type declarations — Python infers them. Output: Andrew, then 31.',
    predict: {
      code: 'x = 10\ny = x + 5\nx = 20\nprint(y)',
      question: 'What gets printed?',
      choices: ['15', '20', '25', '10'],
      answer: 0,
      why: 'y was computed when x was still 10, so y holds 15. Changing x afterwards does not reach back and change y — y stored a value, not a formula.'
    },
    step: {
      code: 'score = 40\nbonus = 8\nscore = score + bonus\nprint(score)',
      steps: [
        {line: 1, vars: {score: 40}, out: '', note: 'A box named score is created holding 40.'},
        {line: 2, vars: {score: 40, bonus: 8}, out: '', note: 'A second box, bonus, holds 8.'},
        {line: 3, vars: {score: 48, bonus: 8}, out: '', note: 'Right side first: score + bonus = 40 + 8 = 48. That replaces score.'},
        {line: 4, vars: {score: 48, bonus: 8}, out: '48', note: 'print reads the current value out of the box.'}
      ],
      finalQ: {question: 'At the end, what is inside bonus?', choices: ['8', '48', '40', 'Nothing — it was used up'], answer: 0, why: 'Using a variable never empties it. bonus is still 8; only score was overwritten.'}
    },
    parsons: {
      prompt: 'Build a program that stores a name and an age, then prints the name on one line and the age on the next.',
      lines: ['name = "Maya"', 'age = 27', 'print(name)', 'print(age)'],
      expected: ['Maya', '27']
    },
    build: {
      prompt: 'A farmer picks 12 apples, then eats 5. Set apples to 12 and eaten to 5, compute left = apples - eaten, and print left.',
      starter: 'apples = 0\neaten = 0\nleft = 0\nprint(left)',
      hint: 'Change the three 0 values: two are given in the prompt, the third is a subtraction.',
      solution: 'apples = 12\neaten = 5\nleft = apples - eaten\nprint(left)',
      checks: [{type: 'output', expected: ['7']}, {type: 'var', name: 'left', expected: 7}]
    }
  },
  java: {
    label: 'Java',
    teachCode: 'public class Main {\n    public static void main(String[] args) {\n        String name = "Andrew";\n        int age = 30;\n        double height = 5.9;\n        boolean isCoding = true;\n\n        age = age + 1;\n        System.out.println(name);\n        System.out.println(age);\n    }\n}',
    teachNote: 'Every variable declares its type, every statement ends with ; and the code lives inside a class + main method. Output: Andrew, then 31. In the exercises below, you write the code that goes inside main.',
    predict: {
      code: 'int x = 10;\nint y = x + 5;\nx = 20;\nSystem.out.println(y);',
      question: 'What gets printed?',
      choices: ['15', '20', '25', '10'],
      answer: 0,
      why: 'y was computed when x was still 10, so y holds 15. Changing x afterwards does not reach back and change y — y stored a value, not a formula.'
    },
    step: {
      code: 'int score = 40;\nint bonus = 8;\nscore = score + bonus;\nSystem.out.println(score);',
      steps: [
        {line: 1, vars: {score: 40}, out: '', note: 'An int box named score is created holding 40.'},
        {line: 2, vars: {score: 40, bonus: 8}, out: '', note: 'A second box, bonus, holds 8.'},
        {line: 3, vars: {score: 48, bonus: 8}, out: '', note: 'Right side first: score + bonus = 40 + 8 = 48. That replaces score.'},
        {line: 4, vars: {score: 48, bonus: 8}, out: '48', note: 'println reads the current value out of the box.'}
      ],
      finalQ: {question: 'At the end, what is inside bonus?', choices: ['8', '48', '40', 'Nothing — it was used up'], answer: 0, why: 'Using a variable never empties it. bonus is still 8; only score was overwritten.'}
    },
    parsons: {
      prompt: 'Build a program that stores a name and an age, then prints the name on one line and the age on the next.',
      lines: ['String name = "Maya";', 'int age = 27;', 'System.out.println(name);', 'System.out.println(age);'],
      expected: ['Maya', '27']
    },
    build: {
      prompt: 'A farmer picks 12 apples, then eats 5. Set apples to 12 and eaten to 5, compute left = apples - eaten, and print left.',
      starter: 'int apples = 0;\nint eaten = 0;\nint left = 0;\nSystem.out.println(left);',
      hint: 'Change the three 0 values: two are given in the prompt, the third is a subtraction. Do not forget the semicolons.',
      solution: 'int apples = 12;\nint eaten = 5;\nint left = apples - eaten;\nSystem.out.println(left);',
      checks: [{type: 'output', expected: ['7']}, {type: 'var', name: 'left', expected: 7}]
    }
  }
},
{
  id: 'operators', num: 2, icon: '🧮', title: 'Operators & Strings',
  tagline: 'Math, remainders, and gluing text together',
  teach: {
    body: 'Operators are the verbs of code: + - * / do arithmetic, and % (modulo) gives you the remainder after division — 17 % 5 is 2, because 5 goes into 17 three times with 2 left over. Remainders sound dull until you realize they answer real questions: is this number even? Which row does item 53 land in? What is left after splitting into groups?\n\nStrings have their own version of +: it joins text end to end instead of adding. "code" + "dojo" is "codedojo" — no space is added for you.\n\nOrder of operations works like school math: parentheses first, then * / %, then + -. When in doubt, add parentheses and make your intent obvious.',
    points: ['% gives the remainder: 17 % 5 = 2', '+ on strings joins them — no automatic space', 'Division is the big language difference (see Compare)', 'Parentheses override the normal order of operations'],
    compare: 'Python: / always gives a decimal (7 / 2 = 3.5) and // is floor division (7 // 2 = 3). Java: / between two ints throws the decimal away (7 / 2 = 3) — you only get 3.5 if one side is a double. This one difference causes real bugs for people switching languages.'
  },
  py: {
    label: 'Python',
    teachCode: 'price = 12\nqty = 3\ntotal = price * qty\n\nfirst = "code"\nsecond = "dojo"\nprint(first + " " + second)\nprint(total)',
    teachNote: 'Output: "code dojo" (the space is an explicit string), then 36.',
    predict: {
      code: 'a = 17\nb = 5\nprint(a // b)\nprint(a % b)',
      question: 'What gets printed?',
      choices: ['3\n2', '3\n3', '4\n1', '2\n3'],
      answer: 0,
      why: '17 // 5 asks "how many whole 5s fit in 17?" — 3. 17 % 5 asks "what is left over?" — 2. Together they are division taken apart.'
    },
    step: {
      code: 'total = 0\nitem = 25\ntotal = total + item\nitem = 10\ntotal = total + item\nprint(total)',
      steps: [
        {line: 1, vars: {total: 0}, out: '', note: 'total starts at 0 — the standard starting point for adding things up.'},
        {line: 2, vars: {total: 0, item: 25}, out: '', note: 'First item costs 25.'},
        {line: 3, vars: {total: 25, item: 25}, out: '', note: 'total becomes 0 + 25.'},
        {line: 4, vars: {total: 25, item: 10}, out: '', note: 'item is reused for the second price. total is untouched.'},
        {line: 5, vars: {total: 35, item: 10}, out: '', note: 'total becomes 25 + 10. This add-to-yourself pattern is called an accumulator.'},
        {line: 6, vars: {total: 35, item: 10}, out: '35', note: 'Print the final total.'}
      ],
      finalQ: {question: 'Why did line 4 not change total?', choices: ['item and total are separate boxes', 'Python skipped line 4', 'total was locked after line 3', '10 is not a valid price'], answer: 0, why: 'Assigning to item only changes item. total changes only on lines that assign to total.'}
    },
    parsons: {
      prompt: 'Build a program that joins a first and last name into one full name and prints it in all caps.',
      lines: ['first = "ada"', 'last = "lovelace"', 'full = first + " " + last', 'print(full.upper())'],
      expected: ['ADA LOVELACE']
    },
    build: {
      prompt: 'A rectangle has width 9 and height 4. Compute its area (width * height) and its perimeter (2 * (width + height)), store them in area and perimeter, and print area on one line, perimeter on the next.',
      starter: 'width = 9\nheight = 4\narea = 0\nperimeter = 0\nprint(area)\nprint(perimeter)',
      hint: 'area replaces its 0 with width * height. perimeter needs parentheses: 2 * (width + height), otherwise you compute 2 * width + height.',
      solution: 'width = 9\nheight = 4\narea = width * height\nperimeter = 2 * (width + height)\nprint(area)\nprint(perimeter)',
      checks: [{type: 'output', expected: ['36', '26']}, {type: 'var', name: 'area', expected: 36}, {type: 'var', name: 'perimeter', expected: 26}]
    }
  },
  java: {
    label: 'Java',
    teachCode: 'int price = 12;\nint qty = 3;\nint total = price * qty;\n\nString first = "code";\nString second = "dojo";\nSystem.out.println(first + " " + second);\nSystem.out.println(total);',
    teachNote: 'Output: "code dojo" (the space is an explicit string), then 36. + with a String on either side joins text — even numbers get converted and glued.',
    predict: {
      code: 'int a = 17;\nint b = 5;\nSystem.out.println(a / b);\nSystem.out.println(a % b);',
      question: 'What gets printed?',
      choices: ['3\n2', '3.4\n2', '4\n1', '3\n3'],
      answer: 0,
      why: 'In Java, int / int discards the decimal part: 17 / 5 is 3, not 3.4. And 17 % 5 is the remainder, 2.'
    },
    step: {
      code: 'int total = 0;\nint item = 25;\ntotal = total + item;\nitem = 10;\ntotal = total + item;\nSystem.out.println(total);',
      steps: [
        {line: 1, vars: {total: 0}, out: '', note: 'total starts at 0 — the standard starting point for adding things up.'},
        {line: 2, vars: {total: 0, item: 25}, out: '', note: 'First item costs 25.'},
        {line: 3, vars: {total: 25, item: 25}, out: '', note: 'total becomes 0 + 25.'},
        {line: 4, vars: {total: 25, item: 10}, out: '', note: 'item is reused for the second price. total is untouched.'},
        {line: 5, vars: {total: 35, item: 10}, out: '', note: 'total becomes 25 + 10. This add-to-yourself pattern is called an accumulator.'},
        {line: 6, vars: {total: 35, item: 10}, out: '35', note: 'Print the final total.'}
      ],
      finalQ: {question: 'Why did line 4 not change total?', choices: ['item and total are separate boxes', 'Java skipped line 4', 'total was locked after line 3', '10 is not a valid price'], answer: 0, why: 'Assigning to item only changes item. total changes only on lines that assign to total.'}
    },
    parsons: {
      prompt: 'Build a program that joins a first and last name into one full name and prints it in all caps.',
      lines: ['String first = "ada";', 'String last = "lovelace";', 'String full = first + " " + last;', 'System.out.println(full.toUpperCase());'],
      expected: ['ADA LOVELACE']
    },
    build: {
      prompt: 'A rectangle has width 9 and height 4. Compute its area (width * height) and its perimeter (2 * (width + height)), store them in area and perimeter, and print area on one line, perimeter on the next.',

    var rcols = tableCols(db, j.source);
    var ralias = j.source.subquery ? j.source.alias : (j.source.alias || j.source.table);
    var out = [];
    ctxs.forEach(function(l){
      var matched = false;
      right.forEach(function(r){
        var merged = {}; Object.keys(l).forEach(function(k){ merged[k] = l[k]; }); Object.keys(r).forEach(function(k){ merged[k] = r[k]; });
        if (truthy(evalExpr(j.on, merged, null))){ out.push(merged); matched = true; }
      });
      if (!matched && j.type === 'left'){
        var ext = {}; Object.keys(l).forEach(function(k){ ext[k] = l[k]; });
        rcols.forEach(function(c){ ext[c] = null; ext[ralias + '.' + c] = null; });
        out.push(ext);
      }
    });
    ctxs = out;
    if (trace) snap('join', (j.type === 'left' ? 'LEFT JOIN ' : 'JOIN ') + ralias, ctxs);
  });
  if (q.where){
    ctxs = ctxs.filter(function(c){ return truthy(evalExpr(q.where, c, null)); });
    if (trace) snap('where', 'WHERE ' + exprLabel(q.where), ctxs);
  }
  /* grouping */
  var hasAgg = q.items.some(function(it){ return exprHasAgg(it.expr); }) || exprHasAgg(q.having);
  var grouped = null; /* [{ctx, group}] */
  if (q.groupBy){
    var groups = {}, order = [];
    ctxs.forEach(function(c){
      var key = JSON.stringify(q.groupBy.map(function(g){ return evalExpr(g, c, null); }));
      if (!groups[key]){ groups[key] = {ctx: c, group: []}; order.push(groups[key]); }
      groups[key].group.push(c);
    });
    grouped = order;
    if (trace){
      var gdisp = grouped.map(function(g){
        var o = {};
        q.groupBy.forEach(function(gx){ var nm = gx.type === 'col' ? gx.name : exprLabel(gx); o[nm] = evalExpr(gx, g.ctx, null); });
        o['rows_in_group'] = g.group.length;
        return o;
      });
      trace.push({clause: 'group', label: 'GROUP BY ' + q.groupBy.map(exprLabel).join(', '), cols: gdisp.length ? Object.keys(gdisp[0]) : [], rows: gdisp.slice(0, CAP), total: grouped.length});
    }
  } else if (hasAgg){
    grouped = [{ctx: ctxs[0] || {}, group: ctxs}];
  } else {
    grouped = ctxs.map(function(c){ return {ctx: c, group: null}; });
  }
  if (q.having){
    grouped = grouped.filter(function(g){ return truthy(evalExpr(q.having, g.ctx, g.group)); });
    if (trace) snap('having', 'HAVING ' + exprLabel(q.having), grouped.map(function(g){ return g.ctx; }));
  }
  /* window functions: assign into ctx under __w<itemIdx> */
  var winItems = [];
  q.items.forEach(function(it, idx){ if (it.expr && it.expr.type === 'func' && it.expr.over) winItems.push(idx); });
  if (winItems.length){
    winItems.forEach(function(idx){
      var fn = q.items[idx].expr, ov = fn.over;
      var parts = {};
      grouped.forEach(function(g, gi){
        var key = JSON.stringify(ov.partitionBy.map(function(p){ return evalExpr(p, g.ctx, g.group); }));
        (parts[key] = parts[key] || []).push(gi);
      });
      Object.keys(parts).forEach(function(key){
        var idxs = parts[key].slice();
        if (ov.orderBy.length){
          idxs = sortRows(idxs, ov.orderBy, function(t, gi){ return evalExpr(t.expr, grouped[gi].ctx, grouped[gi].group); });
        }
        var lastKeys = null, rank = 0, dense = 0;
        idxs.forEach(function(gi, pos){
          var keys = ov.orderBy.map(function(t){ return evalExpr(t.expr, grouped[gi].ctx, grouped[gi].group); });
          var same = lastKeys !== null && JSON.stringify(keys) === JSON.stringify(lastKeys);
          if (!same){ rank = pos + 1; dense++; lastKeys = keys; }
          var val = fn.name === 'ROW_NUMBER' ? pos + 1 : fn.name === 'RANK' ? rank : fn.name === 'DENSE_RANK' ? dense : null;
          if (val === null) throw new Error('Unsupported window function: ' + fn.name + ' (this dojo supports ROW_NUMBER, RANK, DENSE_RANK)');
          grouped[gi].ctx['__w' + idx] = val;
        });
      });
    });
  }
  /* SELECT projection */
  var outCols = [], outRows = [];
  grouped.forEach(function(g){
    var o = {};
    q.items.forEach(function(it, idx){
      if (it.star){
        Object.keys(g.ctx).forEach(function(k){ if (k.indexOf('.') < 0 && k.indexOf('__') !== 0 && !(k in o)) o[k] = g.ctx[k]; });
      } else if (it.expr.type === 'tstar'){
        Object.keys(g.ctx).forEach(function(k){ if (k.indexOf(it.expr.table + '.') === 0){ var nm = k.slice(it.expr.table.length + 1); if (!(nm in o)) o[nm] = g.ctx[k]; } });
      } else if (it.expr.type === 'func' && it.expr.over){
        o[itemName(it)] = g.ctx['__w' + idx];
      } else {
        o[itemName(it)] = evalExpr(it.expr, g.ctx, g.group);
      }
    });
    outRows.push(o);
  });
  outCols = outRows.length ? Object.keys(outRows[0]) : q.items.filter(function(it){ return !it.star; }).map(function(it){ return itemName(it); });
  if (trace) trace.push({clause: 'select', label: 'SELECT' + (q.distinct ? ' DISTINCT' : ''), cols: outCols, rows: outRows.slice(0, CAP), total: outRows.length});
  if (q.distinct){
    var seen = {}; var ded = [];
    outRows.forEach(function(r){ var k = JSON.stringify(r); if (!seen[k]){ seen[k] = 1; ded.push(r); } });
    outRows = ded;
  }
  if (q.orderBy){
    var pairs = outRows.map(function(r, i){ return {r: r, g: grouped[i]}; });
    var sorted = sortRows(pairs, q.orderBy, function(t, p){
      var nm = t.expr.type === 'col' && !t.expr.table ? t.expr.name : null;
      if (nm && Object.prototype.hasOwnProperty.call(p.r, nm)) return p.r[nm];
      return evalExpr(t.expr, p.g.ctx, p.g.group);
    });
    outRows = sorted.map(function(p){ return p.r; });
    if (trace) trace.push({clause: 'order', label: 'ORDER BY ' + q.orderBy.map(function(t){ return exprLabel(t.expr) + (t.dir === 'DESC' ? ' DESC' : ''); }).join(', '), cols: outCols, rows: outRows.slice(0, CAP), total: outRows.length});
  }
  if (q.limit !== undefined){
    outRows = outRows.slice(q.offset || 0, (q.offset || 0) + q.limit);
    if (trace) trace.push({clause: 'limit', label: 'LIMIT ' + q.limit, cols: outCols, rows: outRows.slice(0, CAP), total: outRows.length});
  }
  return {cols: outCols, rows: outRows};
}

function executeTop(q, db, trace){
  var effDb = db;
  if (q.ctes){
    effDb = {}; Object.keys(db).forEach(function(k){ effDb[k] = db[k]; });
    q.ctes.forEach(function(c){ effDb[c.name] = executeTop(c.query, effDb, null).rows; });
  }
  if (!q.setOps) return executeCore(q, effDb, trace);
  var acc = executeCore(q.first, effDb, null);
  var cols = acc.cols, rows = acc.rows;
  var keyOf = function(row){ return JSON.stringify(cols.map(function(c){ return row[c] === undefined ? null : row[c]; })); };
  q.setOps.forEach(function(o){
    var r = executeCore(o.core, effDb, null).rows;
    var rkeys = {}; r.forEach(function(row){ rkeys[keyOf(row)] = 1; });
    if (o.op === 'UNION' && o.all){ rows = rows.concat(r); }
    else if (o.op === 'UNION'){
      var seen = {}, out = [];
      rows.concat(r).forEach(function(row){ var k = keyOf(row); if (!seen[k]){ seen[k] = 1; out.push(row); } });
      rows = out;
    }
    else if (o.op === 'INTERSECT'){
      var seen2 = {}, out2 = [];
      rows.forEach(function(row){ var k = keyOf(row); if (rkeys[k] && !seen2[k]){ seen2[k] = 1; out2.push(row); } });
      rows = out2;
    }
    else if (o.op === 'EXCEPT'){
      var seen3 = {}, out3 = [];
      rows.forEach(function(row){ var k = keyOf(row); if (!rkeys[k] && !seen3[k]){ seen3[k] = 1; out3.push(row); } });
      rows = out3;
    }
    if (trace) trace.push({clause: 'set', label: o.op + (o.all ? ' ALL' : ''), cols: cols, rows: rows.slice(0, 15), total: rows.length});
  });
  if (q.orderBy){
    rows = sortRows(rows, q.orderBy, function(t, r){
      if (t.expr.type === 'col' && !t.expr.table && Object.prototype.hasOwnProperty.call(r, t.expr.name)) return r[t.expr.name];
      return evalExpr(t.expr, r, null);
    });
    if (trace) trace.push({clause: 'order', label: 'ORDER BY', cols: cols, rows: rows.slice(0, 15), total: rows.length});
  }
  if (q.limit !== undefined){
    rows = rows.slice(q.offset || 0, (q.offset || 0) + q.limit);
    if (trace) trace.push({clause: 'limit', label: 'LIMIT ' + q.limit, cols: cols, rows: rows.slice(0, 15), total: rows.length});
  }
  return {cols: cols, rows: rows};
}

function runSQL(sql, db){
  try {
    var p = new Parser(tokenize(sql));
    var q = p.parseQuery();
    if (!p.eof()) throw new Error('Unexpected extra text at the end of the query');
    var res = executeTop(q, db, null);
    return {ok: true, cols: res.cols, rows: res.rows, error: null};
  } catch (e){ return {ok: false, cols: [], rows: [], error: e.message}; }
}
function traceSQL(sql, db){
  try {
    var p = new Parser(tokenize(sql));
    var q = p.parseQuery();
    if (!p.eof()) throw new Error('Unexpected extra text at the end of the query');
    var trace = [];
    var res = executeTop(q, db, trace);
    return {ok: true, stages: trace, cols: res.cols, rows: res.rows, error: null};
  } catch (e){ return {ok: false, stages: [], cols: [], rows: [], error: e.message}; }
}

var API = {runSQL: runSQL, traceSQL: traceSQL};
if (typeof module !== 'undefined' && module.exports) module.exports = API;
if (typeof window !== 'undefined') window.SQL_ENGINE = API;
})();

function JV2(body){ return 'public class Main {\n    public static void main(String[] args) {\n' + body + '\n    }\n}'; }

{
  id: 'java-ch5', n: 5, icon: '🔀', title: 'Conditionals & Logic',
  sub: 'Branching: if/else chains, switch, the ternary — and the boundary cases that break them.',
  objectives: 'CSCI-241 CS 1–2, 4: selection structures; relational and logical operators; boundary errors.',
  teach: {
    body: 'A program that cannot branch cannot decide. if runs its block when the condition is true; else if offers the next test in line; else catches everything left. Conditions combine with && (both), || (either) and ! (not) — and && / || short-circuit: once the answer is decided, the rest is never evaluated. switch is the cleaner tool when one value picks among fixed cases — but a missing break lets execution fall through into the next case.',
    points: ['Test boundaries on purpose: the value exactly AT the cutoff is where conditionals lie.', 'else belongs to the nearest if — braces decide what you meant.', '&& stops at the first false; || stops at the first true.', 'switch cases fall through without break — sometimes a feature, usually a bug.']
  },
  questions: [
    {id: 'j5q1', type: 'build', diff: 'Warm-up', title: 'Pass or Retry', tags: ['conditionals'],
     prompt: 'An int score holds 72. Print "Pass" when the score is 60 or more, otherwise print "Retry". For this score:\nPass',
     starter: progJ('int score = 72;\n// Branch and print the verdict.'),
     solution: progJ('int score = 72;\nif (score >= 60) {\n    System.out.println("Pass");\n} else {\n    System.out.println("Retry");\n}'),
     checks: [{type: 'output', lines: ['Pass']}],
     hint: 'The cutoff itself passes: the condition is score >= 60, not score > 60. That one-character difference is the classic boundary bug.',
     moves: ['if / else: exactly one branch runs.', '>= includes the boundary; > excludes it.'],
     note: 'Every cutoff has a fence-sitter value — decide on purpose which side it lands on.'},
    {id: 'j5q2', type: 'build', diff: 'Warm-up', title: 'Even or Odd', tags: ['conditionals', 'types-conversion'],
     prompt: 'An int n holds 17. Print "Even" if it divides by 2 with no remainder, otherwise "Odd":\nOdd',
     starter: progJ('int n = 17;\n// Test the remainder and print.'),
     solution: progJ('int n = 17;\nif (n % 2 == 0) {\n    System.out.println("Even");\n} else {\n    System.out.println("Odd");\n}'),
     checks: [{type: 'output', lines: ['Odd']}],
     hint: 'n % 2 is the remainder after dividing by 2 — zero means even. Chapter 2\'s % is the tool.',
     moves: ['Parity is a remainder question, not a division question.', '== compares; = assigns. In a condition you want ==.'],
     note: '% asks "what is left" — and "nothing left" is what even means.'},
    {id: 'j5q3', type: 'trace', diff: 'Core', title: 'Chain Reaction', tags: ['conditionals'],
     code: progJ('int score = 75;\nif (score >= 90) {\n    System.out.println("A");\n} else if (score >= 80) {\n    System.out.println("B");\n} else if (score >= 70) {\n    System.out.println("C");\n} else {\n    System.out.println("F");\n}'),
     question: 'What prints?',
     choices: ['C', 'B', 'F', 'A, then C'],
     answer: 0,
     why: 'The chain tests top to bottom and stops at the first true condition: 75 fails >= 90 and >= 80, passes >= 70 — "C". The else never runs, and no second branch can fire.',
     note: 'An else-if chain is a waterfall: the first true test catches everything, the rest run dry.'},
    {id: 'j5q4', type: 'build', diff: 'Core', title: 'Sign Checker', tags: ['conditionals'],
     prompt: 'An int n holds -4. Print "Positive" if it is above zero, "Negative" if below, and "Zero" if it is exactly zero:\nNegative',
     starter: progJ('int n = -4;\n// A three-way branch.'),
     solution: progJ('int n = -4;\nif (n > 0) {\n    System.out.println("Positive");\n} else if (n < 0) {\n    System.out.println("Negative");\n} else {\n    System.out.println("Zero");\n}'),
     checks: [{type: 'output', lines: ['Negative']}],
     hint: 'Three outcomes means a chain: if, else if, else. Zero is the case the first two tests both reject.',
     moves: ['else if adds a test; the final else is "none of the above".', 'Order the tests so each value lands in exactly one branch.'],
     note: 'A chain partitions the number line — every value gets exactly one home.'},
    {id: 'j5q5', type: 'build', diff: 'Core', title: 'Weekend?', tags: ['conditionals'],
     prompt: 'Days are numbered 1 (Mon) to 7 (Sun). An int day holds 6. Use a switch to print "Weekend" for days 6 and 7, and "Weekday" for everything else:\nWeekend\nLet the two weekend cases share one answer.',
     starter: progJ('int day = 6;\n// switch on day.'),
     solution: progJ('int day = 6;\nswitch (day) {\n    case 6:\n    case 7:\n        System.out.println("Weekend");\n        break;\n    default:\n        System.out.println("Weekday");\n}'),
     checks: [{type: 'output', lines: ['Weekend']}],
     hint: 'Stack the cases: case 6 with nothing under it falls into case 7\'s code. That fallthrough is a feature here.',
     moves: ['Empty cases stack — several labels, one block of code.', 'break ends the switch; default is the catch-all.'],
     note: 'Fallthrough is a leak — except when you stack labels on purpose to share one answer.'},
    {id: 'j5q6', type: 'build', diff: 'Stretch', title: 'Biggest of Three', tags: ['conditionals'],
     prompt: 'Three ints: a = 3, b = 9, c = 7. Using conditionals (no Math.max this time), print:\nMax: 9',
     starter: progJ('int a = 3;\nint b = 9;\nint c = 7;\n// Crown the max.'),
     solution: progJ('int a = 3;\nint b = 9;\nint c = 7;\nint max = a;\nif (b > max) {\n    max = b;\n}\nif (c > max) {\n    max = c;\n}\nSystem.out.println("Max: " + max);'),
     checks: [{type: 'output', lines: ['Max: 9']}],
     hint: 'Crown a champion, then let each challenger try to take the title: if (challenger > max) max = challenger;',
     moves: ['The champion pattern: start with the first, challenge with the rest.', 'Two separate ifs — both challengers must get their shot.'],
     note: 'Max-finding is a tournament: hold the current champion and let every value challenge it.'},
    {id: 'j5q7', type: 'classify', diff: 'Core', title: 'The Runaway Print', tags: ['debugging', 'conditionals'], premise: 'runs', premiseOutput: ['B'],
     code: progJ('boolean ok = false;\nif (ok)\n    System.out.println("A");\nSystem.out.println("B");'),
     question: 'ok is false, so "A" is correctly skipped — but "B" prints anyway, even though it is indented as if the if controlled it. What kind of error is this?',
     choices: ['Logic error — without braces, the if owns only the very next statement', 'Syntax error — an if without braces never compiles', 'Runtime error — boolean variables cannot be false'],
     answer: 0,
     why: 'Braces define the block. Without them, the if controls exactly one statement ("A"); "B" is a separate, unconditional statement and always prints. Perfectly legal, quietly wrong: a logic error.',
     note: 'An if without braces holds exactly one statement — indentation is a lie the compiler does not read.'},
    {id: 'j5q8', type: 'build', diff: 'Stretch', title: 'Ticket Price', tags: ['conditionals'],
     prompt: 'An int age holds 15. Use the ternary operator to pick a ticket label — "Child $8" under 18, "Adult $12" otherwise — store it in a String, and print it:\nChild $8',
     starter: progJ('int age = 15;\n// String ticket = condition ? ... : ...;'),
     solution: progJ('int age = 15;\nString ticket = age < 18 ? "Child $8" : "Adult $12";\nSystem.out.println(ticket);'),
     checks: [{type: 'output', lines: ['Child $8']}],
     hint: 'condition ? valueIfTrue : valueIfFalse — the whole thing is an expression, so it can sit on the right side of =.',
     moves: ['The ternary is an if that produces a value.', 'Both branches must have the same type — here, both are Strings.'],
     note: 'if makes a decision; ?: makes a decision AND hands you the result.'},
    {id: 'j5q9', type: 'trace', diff: 'Stretch', title: 'Short-Circuit', tags: ['conditionals', 'debugging'],
     code: progJ('boolean a = false;\nif (a && (10 / 0 == 0)) {\n    System.out.println("Boom");\n} else {\n    System.out.println("Safe");\n}'),
     question: 'There is a division by zero hiding in this code. What happens?',
     choices: ['It prints Safe — the division never happens', 'It crashes — division by zero always explodes', 'It prints Boom', 'It does not compile'],
     answer: 0,
     why: '&& short-circuits: a is false, so the whole AND is already decided false — the right side, division included, is never evaluated. The else runs and prints "Safe".',
     note: '&& is a lazy judge: the moment one side says false, the verdict is in and the other witness is never called.'},
    {id: 'j5q10', type: 'build', diff: 'Boss', title: 'Grade and Comment', tags: ['conditionals'],
     prompt: 'An int score holds 85. First, work out the letter grade with an if-chain (A ≥ 90, B ≥ 80, C ≥ 70, D ≥ 60, F below). Then use a switch on the letter to pick a comment: A "Excellent", B "Solid work", C "Fair", D "Needs work", F "See me". Print:\nGrade: B\nSolid work',
     starter: progJ('int score = 85;\n// Chain for the letter, switch for the comment.'),
     solution: progJ('int score = 85;\nString grade;\nif (score >= 90) {\n    grade = "A";\n} else if (score >= 80) {\n    grade = "B";\n} else if (score >= 70) {\n    grade = "C";\n} else if (score >= 60) {\n    grade = "D";\n} else {\n    grade = "F";\n}\nString comment;\nswitch (grade) {\n    case "A": comment = "Excellent"; break;\n    case "B": comment = "Solid work"; break;\n    case "C": comment = "Fair"; break;\n    case "D": comment = "Needs work"; break;\n    default: comment = "See me";\n}\nSystem.out.println("Grade: " + grade);\nSystem.out.println(comment);'),
     checks: [{type: 'output', lines: ['Grade: B', 'Solid work']}],
     hint: 'Two decisions in sequence: the chain turns a number into a letter; the switch turns the letter into a comment. Declare the Strings first, assign inside the branches.',
     moves: ['A variable declared before the branches can be assigned inside any of them.', 'switch works on Strings in Java — cases are exact matches.'],
     note: 'Programs are pipelines of decisions: each stage\'s output becomes the next stage\'s input.'}
  ]
},
{
  id: 'java-ch6', n: 6, icon: '🔁', title: 'Loops',
  sub: 'Repetition with intent: for, while, do-while — and the off-by-one errors that haunt them.',
  objectives: 'CSCI-241 CS 3–4, 6: repetition structures; choosing the right loop; boundary and off-by-one errors.',
  teach: {
    body: 'Loops turn one idea into many executions. for is built for counted repetition (you know the range); while repeats on a condition (you know the stop rule); do-while guarantees at least one run because it tests at the bottom. Every loop bug in this chapter is one of three: the condition is wrong at the boundary (off-by-one), the update is missing (infinite), or the accumulator starts at the wrong value.',
    points: ['for (start; condition; update) — the condition is checked BEFORE each pass, including the first.', '< vs <= is one whole repetition — the most expensive character in the language.', 'An accumulator starts at the identity: 0 for sums, 1 for products.', 'Sentinel loops read until a special value says stop — the sentinel is data, not counted.']
  },
  questions: [
    {id: 'j6q1', type: 'build', diff: 'Warm-up', title: 'Countdown', tags: ['loops'],
     prompt: 'With a for loop, print the countdown — each number on its own line — then the launch:\n5\n4\n3\n2\n1\nBlast off!',
     starter: progJ('// Count down from 5, then blast off.'),
     solution: progJ('for (int i = 5; i >= 1; i--) {\n    System.out.println(i);\n}\nSystem.out.println("Blast off!");'),
     checks: [{type: 'output', lines: ['5', '4', '3', '2', '1', 'Blast off!']}],
     hint: 'Counting down means the update is i-- and the condition keeps i >= 1.',
     moves: ['A for loop can count in either direction.', 'Start, condition, update — pick all three to match the sequence you want.'],
     note: 'The for header is the whole loop in miniature: where it starts, when it stops, how it steps.'},

     prompt: 'Add up every number from 1 to 100 with a loop and print:\nSum: 5050',
     starter: progJ('// Accumulate the sum in a loop.'),
     solution: progJ('int sum = 0;\nfor (int i = 1; i <= 100; i++) {\n    sum += i;\n}\nSystem.out.println("Sum: " + sum);'),
     checks: [{type: 'output', lines: ['Sum: 5050']}],
     hint: 'An accumulator outside the loop, += inside it. i <= 100 — the 100 must be included.',
     moves: ['Accumulators are declared BEFORE the loop and printed AFTER it.', 'sum += i is sum = sum + i.'],

    {id: 'j6q5', type: 'build', diff: 'Core', title: 'Even Countdown', tags: ['loops'],

     solution: progJ('int i = 10;\nwhile (i >= 2) {\n    System.out.println(i);\n    i -= 2;\n}'),

     hint: 'Step by 2: i -= 2 inside the loop. The update is yours to write — while loops have no built-in step.',

    {id: 'j6q6', type: 'build', diff: 'Stretch', title: 'Sentinel Sum', tags: ['loops', 'input-output'], input: ['4 8 15 0'],
     prompt: 'The user types numbers ending with 0 (shown above the editor). Read until the 0, add up everything before it, and print:\nTotal: 27\nThe 0 is the stop signal — it is not part of the sum.',
     starter: scanStarter('// Read, add, repeat until 0.'),

    {id: 'j6q7', type: 'classify', diff: 'Core', title: 'The Loop That Never Ends', tags: ['debugging', 'loops'], premise: 'no-finish',

     answer: 0,
     why: 'Nothing is misspelled and nothing crashes: the program does exactly what it says, forever. i is never updated inside the body, so i < 5 stays true eternally. An infinite loop from a missing update is a logic error.',
     note: 'A loop is a promise that something changes each pass — break the promise and the condition can never save you.'},
    {id: 'j6q8', type: 'build', diff: 'Stretch', title: 'Unlock Attempts', tags: ['loops', 'input-output'], input: ['3 9 7'],
     prompt: 'A phone unlock code is 7. The user\'s guesses arrive as input (shown above the editor): 3, then 9, then 7. With a do-while loop, keep reading guesses until the right one, counting attempts. Print:\nUnlocked\nAttempts: 3',
     starter: scanStarter('// do-while: guess, count, test.'),
     solution: scanProg('int guess;\nint attempts = 0;\ndo {\n    guess = sc.nextInt();\n    attempts++;\n} while (guess != 7);\nSystem.out.println("Unlocked");\nSystem.out.println("Attempts: " + attempts);'),
     checks: [{type: 'output', lines: ['Unlocked', 'Attempts: 3']}],
     hint: 'do-while fits perfectly: you must guess at least once before there is anything to test. The counter increments inside the body.',
     moves: ['do-while tests at the bottom — the body always runs at least once.', 'Declare guess outside: the condition needs it after the body.'],
     note: 'Pick do-while when the test needs something the body produces — try first, judge after.'},
    {id: 'j6q9', type: 'build', diff: 'Stretch', title: 'Star Grid', tags: ['loops'],

     starter: progJ('// Build each row with an inner loop.'),
     solution: progJ('for (int row = 0; row < 3; row++) {\n    String line = "";\n    for (int col = 0; col < 3; col++) {\n        line += "*";\n    }\n    System.out.println(line);\n}'),
     checks: [{type: 'output', lines: ['***', '***', '***']}],
     hint: 'The inner loop appends to a String; printing happens once per row, after the inner loop finishes. Reset the row string each outer pass.',
     moves: ['Nested loops: the inner one runs fully for every single outer step.', 'Accumulate a row, print the row — two different rhythms.'],
     note: 'Nested loops are gears: the small gear spins completely for every tooth of the big one.'},
    {id: 'j6q10', type: 'build', diff: 'Boss', title: 'Factorial', tags: ['loops'],
     prompt: 'Compute 5! (5 factorial = 5 × 4 × 3 × 2 × 1) with a loop and print:\n5! = 120',
     starter: progJ('// A product accumulator this time.'),
     solution: progJ('int result = 1;\nfor (int i = 2; i <= 5; i++) {\n    result *= i;\n}\nSystem.out.println("5! = " + result);'),
     checks: [{type: 'output', lines: ['5! = 120']}],
     hint: 'A product accumulator starts at 1, not 0 — starting at 0 would erase every multiplication.',

{
  id: 'java-ch7', n: 7, icon: '🧩', title: 'Methods & Modular Design',
  sub: 'Break the problem into named pieces: parameters in, values back, one job per method.',
  objectives: 'CSCI-241 MD 1–6: decomposition; parameters; return types; void vs value-returning; reuse.',
  teach: {
    body: 'Methods are how programs stay sane as they grow: one method, one job, a name that says it. A value-returning method is a question with an answer (declare the return type, return the value); a void method is an instruction (it does something, hands nothing back). Parameters are the method\'s inputs — its own private variables, born fresh on every call. Code outside the method cannot see inside it, and that wall is the point.',
    points: ['The signature is a contract: name, parameter types, return type.', 'return ends the method immediately and hands the value to the caller.', 'Arguments are copied into parameters — a method cannot change the caller\'s variables.', 'If main is growing past a screen, it is asking to be decomposed.']
  },
  questions: [
    {id: 'j7q1', type: 'build', diff: 'Warm-up', title: 'The Greeter Method', tags: ['methods'],
     prompt: 'Write a method greet that takes a String name and prints "Hello, <name>!" — then call it from main with "Ana" and "Ben":\nHello, Ana!\nHello, Ben!',
     starter: clsJ('// static void greet(String name) goes here.', 'greet("Ana");\ngreet("Ben");'),
     solution: clsJ('    static void greet(String name) {\n        System.out.println("Hello, " + name + "!");\n    }', 'greet("Ana");\ngreet("Ben");'),
     checks: [{type: 'output', lines: ['Hello, Ana!', 'Hello, Ben!']}],
     hint: 'void means the method does a job and hands nothing back. The name arrives as the parameter — a variable that exists only inside greet.',
     moves: ['static void greet(String name) — the signature states the contract.', 'Write it once, call it twice: reuse is the whole point.'],
     note: 'A method is a recipe written once: the parameter is the ingredient slot, each call cooks it again.'},
    {id: 'j7q2', type: 'build', diff: 'Warm-up', title: 'Square It', tags: ['methods'],

     starter: clsJ('// static int square(int n) goes here.', 'System.out.println("Square: " + square(7));'),
     solution: clsJ('    static int square(int n) {\n        return n * n;\n    }', 'System.out.println("Square: " + square(7));'),
     checks: [{type: 'output', lines: ['Square: 49']}],
     hint: 'The return type in the signature is int, and the body must return an int. The call square(7) IS a value — it can sit inside the println.',
     moves: ['A value-returning method must return on every path.', 'Calls are expressions: use them anywhere a value fits.'],
     note: 'void methods are verbs; value-returning methods are nouns — they stand for the thing they compute.'},
    {id: 'j7q3', type: 'trace', diff: 'Core', title: 'Trace the Call', tags: ['methods'],

    {id: 'j7q4', type: 'build', diff: 'Core', title: 'Is It Even?', tags: ['methods'],

    {id: 'j7q6', type: 'build', diff: 'Stretch', title: 'Celsius, As a Method', tags: ['methods', 'types-conversion'],
     prompt: 'Chapter 2\'s conversion, promoted to a method: write toCelsius, which takes a double Fahrenheit and returns the Celsius value. main converts 68 and prints with printf:\nCelsius: 20.0',
     starter: clsJ('// static double toCelsius(double f) goes here.', 'System.out.printf("Celsius: %.1f", toCelsius(68));'),
     solution: clsJ('    static double toCelsius(double f) {\n        return (f - 32) * 5.0 / 9;\n    }', 'System.out.printf("Celsius: %.1f", toCelsius(68));'),
     checks: [{type: 'output', lines: ['Celsius: 20.0']}],
     hint: 'The formula is the same as Chapter 2 — the method just wraps it. The 5.0 keeps the math decimal.',
     moves: ['A formula used twice deserves a name and a home: a method.', 'The caller should not care how the answer is computed.'],
     note: 'Methods turn formulas into vocabulary: after this, the program can say toCelsius instead of spelling out the math.'},
    {id: 'j7q7', type: 'classify', diff: 'Core', title: 'Out of Scope', tags: ['debugging', 'methods'], premise: 'error',
     code: clsJ('    static void show() {\n        System.out.println(count);\n    }', 'int count = 3;\nshow();'),
     question: 'show tries to print count, which lives in main. The compiler refuses: "cannot find symbol". What kind of error is this — and what is the deeper lesson?',
     choices: ['Syntax (compile) error — a method can only see its own parameters and variables', 'Runtime error — show ran before count existed', 'Logic error — the value printed would have been wrong'],
     answer: 0,
     why: 'count is a local of main; show is a different method with its own scope. The compiler catches the invisible variable before anything runs — a compile error. The fix is to pass count in as a parameter: data crosses method walls through parameters and return values, or not at all.',
     note: 'Method walls are real: values cross as arguments and returns — never by reaching through.'},
    {id: 'j7q8', type: 'build', diff: 'Stretch', title: 'Count the Letter', tags: ['methods', 'loops', 'strings'],
     prompt: 'Write a method countChar that takes a String and a char, and returns how many times that char appears. main counts the a\'s in "banana" and prints:\nCount: 3',
     starter: clsJ('// static int countChar(String s, char target) goes here.', 'System.out.println("Count: " + countChar("banana", \'a\'));'),
     solution: clsJ('    static int countChar(String s, char target) {\n        int count = 0;\n        for (int i = 0; i < s.length(); i++) {\n            if (s.charAt(i) == target) {\n                count++;\n            }\n        }\n        return count;\n    }', 'System.out.println("Count: " + countChar("banana", \'a\'));'),
     checks: [{type: 'output', lines: ['Count: 3']}],
     hint: 'Walk the string with an index, compare s.charAt(i) to the target, and count the matches — the counting pattern, inside a method.',
     moves: ['Two parameters: the haystack and the needle.', 'The accumulator lives inside the method and leaves as the return value.'],
     note: 'Patterns travel: counting matches works the same whether the method gets a string, an array, or a file.'},
    {id: 'j7q9', type: 'build', diff: 'Stretch', title: 'Repeat After Me', tags: ['methods', 'loops'],
     prompt: 'Write a method repeat that takes a String and an int n, and returns the string repeated n times. main prints repeat("ha", 3):\nhahaha',
     starter: clsJ('// static String repeat(String w, int n) goes here.', 'System.out.println(repeat("ha", 3));'),
     solution: clsJ('    static String repeat(String w, int n) {\n        String out = "";\n        for (int i = 0; i < n; i++) {\n            out += w;\n        }\n        return out;\n    }', 'System.out.println(repeat("ha", 3));'),
     checks: [{type: 'output', lines: ['hahaha']}],
     hint: 'A String accumulator starts empty ("") and grows with += once per pass.',
     moves: ['Strings accumulate too — the identity for gluing is "".', 'Build the result, then return it once at the end.'],
     note: 'Same snowball as numbers, different substance: start empty, roll n times, hand over the ball.'},
    {id: 'j7q10', type: 'build', diff: 'Boss', title: 'Grade Report', tags: ['methods', 'conditionals'],
     prompt: 'Build a two-method grade report. letterFor takes an int score and returns the letter (A ≥ 90, B ≥ 80, C ≥ 70, D ≥ 60, F below) as a String. commentFor takes the letter and returns a comment (A "Excellent", B "Solid work", C "Fair", D "Needs work", F "See me") — a switch is natural. main reports on 91:\nGrade: A\nExcellent',
     starter: clsJ('// letterFor and commentFor go here.', 'int score = 91;\n// Report on the score.'),
     solution: clsJ('    static String letterFor(int score) {\n        if (score >= 90) {\n            return "A";\n        } else if (score >= 80) {\n            return "B";\n        } else if (score >= 70) {\n            return "C";\n        } else if (score >= 60) {\n            return "D";\n        }\n        return "F";\n    }\n    static String commentFor(String grade) {\n        switch (grade) {\n            case "A": return "Excellent";\n            case "B": return "Solid work";\n            case "C": return "Fair";\n            case "D": return "Needs work";\n            default: return "See me";\n        }\n    }', 'int score = 91;\nString grade = letterFor(score);\nSystem.out.println("Grade: " + grade);\nSystem.out.println(commentFor(grade));'),
     checks: [{type: 'output', lines: ['Grade: A', 'Excellent']}],
     hint: 'Chapter 5\'s two decisions, factored into methods: the chain becomes letterFor, the switch becomes commentFor, and main just conducts.',
     moves: ['Decomposition: each method owns exactly one decision.', 'main reads like a summary — the details live in the methods.'],
     note: 'Good main methods read like a table of contents: the chapters are the methods below it.'}
  ]
},
{
  id: 'java-ch8', n: 8, icon: '🗂️', title: 'Arrays',
  sub: 'One name, many slots: declare, traverse, search, count, and never step past the end.',
  objectives: 'CSCI-241 DC 1–3, 5: arrays; loop processing (search/count/sum/min/max/average); index errors.',
  teach: {
    body: 'An array is a row of slots under one name, indexed from 0 — so a length-n array lives at indexes 0 … n-1, and index n is the classic runtime crash. Almost everything you do with arrays is one traversal pattern wearing different clothes: visit every slot and sum, count, find the extreme, or search. The enhanced for (for (int x : a)) visits values when you do not need positions; the indexed for is for when you do.',
    points: ['a.length is the size; the last legal index is a.length - 1.', 'Traverse with intent: every array loop is sum, count, search, or extreme in disguise.', 'Enhanced for reads values only — it cannot change slots or tell you where you are.', 'An array variable holds a reference to the slots — pass it to a method and the method sees the same slots.']
  },
  questions: [
    {id: 'j8q1', type: 'build', diff: 'Warm-up', title: 'First and Last', tags: ['arrays'],
     prompt: 'An array is declared: int[] nums = {4, 8, 15, 16, 23}; Print its first and last elements:\nFirst: 4\nLast: 23\nThe last one must be found through the array\'s length — not by typing 4 as the index.',
     starter: progJ('int[] nums = {4, 8, 15, 16, 23};\n// Print first and last.'),
     solution: progJ('int[] nums = {4, 8, 15, 16, 23};\nSystem.out.println("First: " + nums[0]);\nSystem.out.println("Last: " + nums[nums.length - 1]);'),
     checks: [{type: 'output', lines: ['First: 4', 'Last: 23']}],
     hint: 'The last index is always length - 1, whatever the length turns out to be.',
     moves: ['nums[0] is the first slot; nums[nums.length - 1] is the last.', 'Never hardcode the last index — lengths change.'],
     note: 'First is 0 and last is length minus one — the two addresses every array guarantees.'},
    {id: 'j8q2', type: 'build', diff: 'Warm-up', title: 'Sum the Array', tags: ['arrays', 'loops'],
     prompt: 'Given int[] values = {3, 5, 7, 9}, traverse it and print the total:\nSum: 24',
     starter: progJ('int[] values = {3, 5, 7, 9};\n// Traverse and total.'),
     solution: progJ('int[] values = {3, 5, 7, 9};\nint sum = 0;\nfor (int v : values) {\n    sum += v;\n}\nSystem.out.println("Sum: " + sum);'),
     checks: [{type: 'output', lines: ['Sum: 24']}],
     hint: 'The enhanced for hands you each value in turn — perfect when you do not need the index. Accumulate as usual.',
     moves: ['Enhanced for: for (int v : values) — v is each value, in order.', 'The sum pattern again: accumulator outside, += inside.'],
     note: 'for-each is a conveyor belt: every slot passes by exactly once, in order.'},
    {id: 'j8q3', type: 'trace', diff: 'Core', title: 'Index Walk', tags: ['arrays'],
     code: progJ('int[] a = {10, 20, 30};\nSystem.out.println(a[1]);\na[1] = 99;\nSystem.out.println(a[1]);'),
     question: 'What two lines print?',
     choices: ['20, then 99', '10, then 99', '20, then 20', '30, then 99'],
     answer: 0,
     why: 'a[1] is the SECOND slot (indexes start at 0), holding 20. The assignment a[1] = 99 overwrites that slot, so the second print shows 99. Index 0 and 2 were never touched.',
     note: 'An index is an address: reading it copies the value out, assigning replaces what lives there.'},
    {id: 'j8q4', type: 'build', diff: 'Core', title: 'Find the Max', tags: ['arrays', 'loops'],
     prompt: 'Given int[] data = {12, 45, 7, 34}, find and print the largest value:\nMax: 45\nStart your champion at the first element — not at 0 (ask yourself why 0 would be a lie for an all-negative array).',
     starter: progJ('int[] data = {12, 45, 7, 34};\n// Crown the max.'),
     solution: progJ('int[] data = {12, 45, 7, 34};\nint max = data[0];\nfor (int i = 1; i < data.length; i++) {\n    if (data[i] > max) {\n        max = data[i];\n    }\n}\nSystem.out.println("Max: " + max);'),
     checks: [{type: 'output', lines: ['Max: 45']}],
     hint: 'Chapter 5\'s tournament, on an array: champion starts at data[0], every later slot challenges.',
     moves: ['Seed the extreme with a real element: data[0].', 'Loop from index 1 — the seed slot needs no challenge.'],
     note: 'Extremes start from evidence (the first element), never from a guess like 0.'},
    {id: 'j8q5', type: 'build', diff: 'Core', title: 'Count the Passes', tags: ['arrays', 'loops', 'conditionals'],
     prompt: 'Given int[] scores = {55, 80, 92, 40, 71}, count how many are passing (60 or above) and print:\nPassing: 3',
     starter: progJ('int[] scores = {55, 80, 92, 40, 71};\n// Count the passing scores.'),
     solution: progJ('int[] scores = {55, 80, 92, 40, 71};\nint count = 0;\nfor (int s : scores) {\n    if (s >= 60) {\n        count++;\n    }\n}\nSystem.out.println("Passing: " + count);'),
     checks: [{type: 'output', lines: ['Passing: 3']}],
     hint: 'The counting pattern: a counter, a traversal, and a condition guarding the ++.',
     moves: ['Count = traverse + test + increment, only on a match.', 'The boundary is >= 60 — 60 itself passes.'],
     note: 'Counting is summing with a filter: add 1 only when the slot earns it.'},
    {id: 'j8q6', type: 'build', diff: 'Stretch', title: 'Reverse Print', tags: ['arrays', 'loops'],
     prompt: 'Given int[] nums = {1, 2, 3, 4}, print the elements backwards, one per line:\n4\n3\n2\n1\nThe array itself stays untouched — you are only visiting in reverse.',
     starter: progJ('int[] nums = {1, 2, 3, 4};\n// Walk it backwards.'),
     solution: progJ('int[] nums = {1, 2, 3, 4};\nfor (int i = nums.length - 1; i >= 0; i--) {\n    System.out.println(nums[i]);\n}'),
     checks: [{type: 'output', lines: ['4', '3', '2', '1']}],
     hint: 'Start the index at length - 1 and step down while i >= 0. Enhanced for cannot do this — it only walks forward.',
     moves: ['Reverse traversal needs the indexed for: start high, i--, stop at 0.', 'Visiting is not modifying: the array is unchanged.'],
     note: 'Need positions or direction? Indexed for. Just values, forward? For-each.'},
    {id: 'j8q7', type: 'classify', diff: 'Core', title: 'One Past the End', tags: ['debugging', 'arrays'], premise: 'error',
     code: progJ('int[] a = {5, 6, 7};\nSystem.out.println(a[3]);'),
     question: 'This compiles cleanly — then dies the moment it runs, with ArrayIndexOutOfBoundsException. What kind of error is that?',
     choices: ['Runtime error — the index crime is only detectable while the program runs', 'Syntax error — arrays may never be printed', 'Logic error — it printed the wrong element'],
     answer: 0,
     why: 'Indexes run 0, 1, 2 for a 3-element array; a[3] asks for a slot that does not exist. The code is grammatical, so the compiler waves it through — the crash happens at runtime, when the access is attempted.',
     note: 'The compiler checks your grammar, not your geography: stepping outside the array is a runtime discovery.'},
    {id: 'j8q8', type: 'build', diff: 'Stretch', title: 'Array Average', tags: ['arrays', 'loops', 'types-conversion'],
     prompt: 'Given int[] temps = {70, 80, 90, 86}, compute the average (a decimal!) and print it with printf:\nAverage: 81.5',
     starter: progJ('int[] temps = {70, 80, 90, 86};\n// Sum, then divide — carefully.'),
     solution: progJ('int[] temps = {70, 80, 90, 86};\nint sum = 0;\nfor (int t : temps) {\n    sum += t;\n}\ndouble avg = (double) sum / temps.length;\nSystem.out.printf("Average: %.1f", avg);'),
     checks: [{type: 'output', lines: ['Average: 81.5']}],
     hint: 'Sum as an int, then cast before dividing — and divide by temps.length, never a hardcoded 4.',
     moves: ['Average = sum / length, with the cast placed before the division.', 'temps.length keeps the code honest if the data changes.'],
     note: 'Every array statistic is a traversal plus one final calculation — and the length comes from the array, not from you.'},
    {id: 'j8q9', type: 'build', diff: 'Stretch', title: 'Roll Call', tags: ['arrays', 'strings'],
     prompt: 'A String array holds the class roster: {"Ana", "Ben", "Cleo"}. With an enhanced for, print each name on its own line, then the class size:\nAna\nBen\nCleo\nStudents: 3',
     starter: progJ('String[] names = {"Ana", "Ben", "Cleo"};\n// Roll call, then the count.'),
     solution: progJ('String[] names = {"Ana", "Ben", "Cleo"};\nfor (String name : names) {\n    System.out.println(name);\n}\nSystem.out.println("Students: " + names.length);'),
     checks: [{type: 'output', lines: ['Ana', 'Ben', 'Cleo', 'Students: 3']}],
     hint: 'Arrays of objects work exactly like arrays of ints — the element type in the for-each is String here.',
     moves: ['for (String name : names) — the loop variable takes the element type.', 'names.length counts the slots, filled or not.'],
     note: 'The traversal patterns are type-blind: once you can walk an int array, you can walk any array.'},
    {id: 'j8q10', type: 'build', diff: 'Boss', title: 'Search Party', tags: ['arrays', 'loops'],
     prompt: 'Given int[] ids = {101, 205, 309, 412}, search for the value 309 and print the index where it lives:\nFound at index: 2\nUse a loop and stop the moment you find it (break) — and find the index by searching, not by knowing it in advance.',
     starter: progJ('int[] ids = {101, 205, 309, 412};\n// Search for 309.'),
     solution: progJ('int[] ids = {101, 205, 309, 412};\nint found = -1;\nfor (int i = 0; i < ids.length; i++) {\n    if (ids[i] == 309) {\n        found = i;\n        break;\n    }\n}\nSystem.out.println("Found at index: " + found);'),
     checks: [{type: 'output', lines: ['Found at index: 2']}],
     hint: 'Keep a found variable starting at -1 ("nowhere yet"). On a match, record the index and break — searching past the find wastes nothing but time.',
     moves: ['-1 is the "not found" sentinel: no real index can be negative.', 'break exits the loop the instant the search succeeds.'],
     note: 'Search = traverse + compare + remember where. The index is the prize, not the value.'}
  ]
},
{
  id: 'java-ch9', n: 9, icon: '🏆', title: 'Foundations Gauntlet',
  sub: 'Everything at once: plan first, then code — mixed problems in the shape of real coursework.',
  objectives: 'CSCI-241 ALG 1–5 + TD 1–4: plan with pseudocode; accumulation, counting, searching, validation; test normal, edge, boundary and invalid cases.',
  teach: {
    body: 'Real problems do not announce which chapter they are from. The gauntlet mixes everything: input, types, strings, branches, loops, methods, arrays — plus the testing mindset the course grades: before you run, predict; when it breaks, classify (syntax? runtime? logic?) before you touch anything. And plan first: two lines of pseudocode ("read values until sentinel; track count and sum; print the average") are worth twenty lines of wandering code.',
    points: ['Plan in pseudocode: name the pattern (accumulate? count? search? validate?) before writing Java.', 'Trace before you run — a prediction turns every run into a test.', 'When it breaks, classify first: the error KIND tells you where to look.', 'Test the boundary and the edge, not just the happy middle.']
  },
  questions: [
    {id: 'j9q1', type: 'build', diff: 'Warm-up', title: 'Two Numbers, Full Treatment', tags: ['input-output', 'types-conversion'], input: ['3 4'],
     prompt: 'The user types two whole numbers: 3 4. Read both and print:\nSum: 7\nAverage: 3.5\nThe average is a decimal — divide carelessly and it will lie.',
     starter: scanStarter('// Read both, print sum and average.'),
     solution: scanProg('int a = sc.nextInt();\nint b = sc.nextInt();\nSystem.out.println("Sum: " + (a + b));\nSystem.out.println("Average: " + ((a + b) / 2.0));'),
     checks: [{type: 'output', lines: ['Sum: 7', 'Average: 3.5']}],
     hint: 'The sum is int math; the average needs a decimal divisor — / 2.0, or a cast. Same parentheses discipline as always.',
     moves: ['One input, two treatments: int for the sum, decimal for the average.', 'The cast (or .0) goes on the division, not on the answer.'],
     note: 'The same numbers can need two types in one program — the operation decides, not the value.'},
    {id: 'j9q2', type: 'trace', diff: 'Core', title: 'Everything at Once', tags: ['arrays', 'loops'],
     code: progJ('int[] a = {2, 4, 6};\nint s = 0;\nfor (int x : a) {\n    s += x;\n}\nSystem.out.println(s);'),
     question: 'What prints?',
     choices: ['12', '246', '6', 'Nothing — arrays cannot be looped'],
     answer: 0,
     why: 'The enhanced for visits 2, 4, 6 in order; the accumulator collects 0 + 2 + 4 + 6 = 12. One pass, three additions.',
     note: 'Fluency is when the patterns stop announcing themselves: array + loop + accumulator reads as one idea.'},
    {id: 'j9q3', type: 'classify', diff: 'Core', title: 'Boundary Blunder', tags: ['debugging', 'loops'], premise: 'runs', premiseOutput: ['0', '1', '2', '3', '4', '5'],
     code: progJ('for (int i = 0; i <= 5; i++) {\n    System.out.println(i);\n}'),
     question: 'The goal was to print 0 through 4 — five lines. The program prints six, ending at 5. It compiles and runs to completion. What kind of error is this?',
     choices: ['Logic error — <= lets i reach 5; the boundary condition is one too generous', 'Syntax error — <= is not a legal operator', 'Runtime error — the loop ran too many times and crashed'],
     answer: 0,
     why: 'Nothing crashed and nothing is misspelled: the condition i <= 5 faithfully includes 5. The instruction itself is wrong by one — the textbook off-by-one logic error, caught only by testing the boundary.',
     note: 'Off-by-one never crashes and never complains: it just quietly does one too many (or one too few).'},
    {id: 'j9q4', type: 'build', diff: 'Core', title: 'Password Gate', tags: ['input-output', 'loops'], input: ['0000 1234'],
     prompt: 'The gate code is 1234. Guesses arrive as input: 0000, then 1234. Keep reading guesses until the right one (compare with equals — these are Strings), count the attempts, and print:\nAttempts: 2\nWelcome',
     starter: scanStarter('// Read guesses until "1234".'),
     solution: scanProg('String guess = sc.next();\nint attempts = 1;\nwhile (!guess.equals("1234")) {\n    guess = sc.next();\n    attempts++;\n}\nSystem.out.println("Attempts: " + attempts);\nSystem.out.println("Welcome");'),
     checks: [{type: 'output', lines: ['Attempts: 2', 'Welcome']}],
     hint: 'The priming-read pattern again, with strings: read once, then loop while the guess is NOT equal — !guess.equals("1234").',
     moves: ['String comparison in a condition still uses equals — == would compare boxes.', 'Validation loops run until the input earns its way out.'],
     note: 'A validation loop is a bouncer: the condition is "not yet", and the input has to change it.'},
    {id: 'j9q5', type: 'build', diff: 'Core', title: 'Method Mixer', tags: ['methods', 'types-conversion'],
     prompt: 'Write a method average3 that takes three ints and returns their average as a double. main averages 80, 90 and 100 and prints with printf:\nAverage: 90.0',
     starter: clsJ('// static double average3(int a, int b, int c) goes here.', 'System.out.printf("Average: %.1f", average3(80, 90, 100));'),
     solution: clsJ('    static double average3(int a, int b, int c) {\n        return (a + b + c) / 3.0;\n    }', 'System.out.printf("Average: %.1f", average3(80, 90, 100));'),
     checks: [{type: 'output', lines: ['Average: 90.0']}],
     hint: 'Inside the method, the divisor decides the type: / 3.0 keeps the fraction; / 3 would truncate before the double ever saw it.',
     moves: ['The return type is a promise — the math inside must honor it.', 'Chapter 2\'s division trap lives inside methods too.'],
     note: 'Wrapping math in a method does not protect it from the old rules — types are types everywhere.'},
    {id: 'j9q6', type: 'classify', diff: 'Core', title: 'The Null Call', tags: ['debugging', 'strings'], premise: 'error',
     code: progJ('String s = null;\nSystem.out.println(s.length());'),
     question: 'This compiles — then explodes the instant it runs, with NullPointerException. What kind of error is it?',
     choices: ['Logic error — null is a legal value, so the program\'s reasoning is at fault', 'Runtime error — the crash happens when the method is called on nothing', 'Syntax error — null may not be assigned to a String'],
     answer: 1,
     why: 'null is a legal String value ("no string at all"), so the compiler is satisfied. The explosion happens during execution, when length() is called on nothing — a runtime error, and the most common one in Java.',
     note: 'null means the box is empty — asking the box to do something is a runtime crash, every time.'},
    {id: 'j9q7', type: 'build', diff: 'Stretch', title: 'Array + Method', tags: ['methods', 'arrays'],
     prompt: 'Write a method sumArray that takes an int array and returns the sum of its elements. main builds {5, 10, 15} and prints:\nTotal: 30',
     starter: clsJ('// static int sumArray(int[] a) goes here.', 'int[] values = {5, 10, 15};\nSystem.out.println("Total: " + sumArray(values));'),
     solution: clsJ('    static int sumArray(int[] a) {\n        int sum = 0;\n        for (int v : a) {\n            sum += v;\n        }\n        return sum;\n    }', 'int[] values = {5, 10, 15};\nSystem.out.println("Total: " + sumArray(values));'),
     checks: [{type: 'output', lines: ['Total: 30']}],
     hint: 'The parameter type is int[] — the whole array travels into the method, and the traversal inside is the one you already know.',
     moves: ['Arrays are legal parameters and the method sees the same slots.', 'The pattern does not change when it moves into a method.'],
     note: 'Methods and arrays compose: hand the method the whole row of slots and let it do its one job.'},
    {id: 'j9q8', type: 'trace', diff: 'Stretch', title: 'Method + Loop Trace', tags: ['methods', 'loops'],
     code: clsJ('    static void blast(int n) {\n        for (int i = n; i >= 1; i--) {\n            System.out.println(i);\n        }\n    }', 'blast(3);'),
     question: 'What prints, in order?',
     choices: ['3, 2, 1', '1, 2, 3', '3, 2, 1, 0', 'Nothing — blast returns void'],
     answer: 0,
     why: 'main calls blast(3), so n is 3. The loop counts i from 3 down to 1, printing each. void means no value comes back — the prints are side effects along the way.',
     note: 'void methods speak through the console, not through a return — tracing them means watching the side effects.'},
    {id: 'j9q9', type: 'build', diff: 'Stretch', title: 'Grade Book Mini', tags: ['arrays', 'loops', 'conditionals'],
     prompt: 'A grade book array: int[] scores = {45, 67, 89, 72, 91}. In one traversal, count the A grades (90 or above) and the passing grades (60 or above). Print:\nA grades: 1\nPassing: 4',
     starter: progJ('int[] scores = {45, 67, 89, 72, 91};\n// One pass, two counters.'),
     solution: progJ('int[] scores = {45, 67, 89, 72, 91};\nint aCount = 0;\nint passing = 0;\nfor (int s : scores) {\n    if (s >= 90) {\n        aCount++;\n    }\n    if (s >= 60) {\n        passing++;\n    }\n}\nSystem.out.println("A grades: " + aCount);\nSystem.out.println("Passing: " + passing);'),
     checks: [{type: 'output', lines: ['A grades: 1', 'Passing: 4']}],
     hint: 'Two counters, two separate ifs — an A is also passing, so the tests must both get their chance (no else!).',
     moves: ['One traversal can feed several independent counters.', 'else would break it: an A must increment BOTH counters.'],
     note: 'When categories overlap, test independently — else is only for categories that exclude each other.'},
    {id: 'j9q10', type: 'build', diff: 'Boss', title: 'Receipt 2.0', tags: ['input-output', 'types-conversion'], input: ['2', '9.5'],
     prompt: 'A shop program reads two values from the user: a quantity (whole number, first line) and a unit price (second line) — the input is shown above the editor. Print:\nItems: 2\nTotal: $19.00',
     starter: scanStarter('// Read qty (int), then price (double); printf the total.'),

<script>
(function(){

function defaultState(){

function migrate(s){

function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
(function touchStreak(){

})();

function escHtml(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  if (Array.isArray(v)) return '[' + v.map(fmtVal).join(', ') + ']';

function divergenceFor(r, b){
  /* Locates the FIRST place the learner's run diverges from the goal, and pairs it

  if (!r.ok) return {kind: 'error',

    question: 'Read the error as a sentence — it names a line and a problem. What is that line trying to do?'};

    var chk = b.checks[i];
    if (chk.type === 'output'){
      var exp = chk.expected, act = r.output;
      if (JSON.stringify(act) === JSON.stringify(exp)) continue;
      var n = Math.min(exp.length, act.length);
      for (var j = 0; j < n; j++){
        if (act[j] !== exp[j]) return {kind: 'line', goalLines: exp,
          text: 'Output line ' + (j + 1) + ': you printed ' + JSON.stringify(act[j]) + ', the goal prints ' + JSON.stringify(exp[j]) + '. Everything before that line matches.',
          question: 'Which line of YOUR code decides what gets printed on output line ' + (j + 1) + ' — and what value flows into it there?'};
      }
      if (act.length < exp.length) return {kind: 'missing', goalLines: exp,
        text: 'Your output stops after line ' + act.length + '. The goal\u2019s next line (' + (act.length + 1) + ') is ' + JSON.stringify(exp[act.length]) + '.',
        question: 'What condition or loop boundary in your code ends things before that line gets printed?'};
      return {kind: 'extra', goalLines: exp,
        text: 'Every goal line matches — then you print an extra line ' + (exp.length + 1) + ': ' + JSON.stringify(act[exp.length]) + '.',
        question: 'Which loop or print in your code runs one time too many?'};
    }
    if (chk.type === 'var'){
      if (JSON.stringify(r.globals[chk.name]) !== JSON.stringify(chk.expected))
        return {kind: 'var',
          text: 'The variable ' + chk.name + ' ends as ' + fmtVal(r.globals[chk.name]) + '; the goal is ' + fmtVal(chk.expected) + '.',
          question: 'Trace the LAST assignment to ' + chk.name + ' in your code: what does it compute, step by step?'};

}

}
function permFor(key, n){
